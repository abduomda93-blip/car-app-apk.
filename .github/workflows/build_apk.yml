name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Fresh Android Project
        run: |
          mkdir -p ../app_backup
          cp -r lib ../app_backup/
          cp pubspec.yaml ../app_backup/
          rm -rf ./* ./.* 2>/dev/null || true
          flutter create --org com.example --project-name car_log_app .
          cp -r ../app_backup/lib ./
          cp ../app_backup/pubspec.yaml ./

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
