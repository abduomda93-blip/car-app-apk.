name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Force V2 Embedding Fix
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/car_log_app
          echo "package com.example.car_log_app" > android/app/src/main/kotlin/com/example/car_log_app/MainActivity.kt
          echo "import io.flutter.embedding.android.FlutterActivity" >> android/app/src/main/kotlin/com/example/car_log_app/MainActivity.kt
          echo "class MainActivity: FlutterActivity() {}" >> android/app/src/main/kotlin/com/example/car_log_app/MainActivity.kt

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
